spring.application.name=demo
# en local lee los secretos del archivo .env (si se ejecuta desde springMatri/demo o desde la carpeta raiz)
# en Render no hay .env: se configuran las variables de entorno en el panel
spring.config.import=optional:file:.env[.properties],optional:file:springMatri/demo/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/matricula}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:alumno}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# las tablas las crea el script sql_matri/MATRICULA_mysql.sql; con "update" Hibernate cambiaba los tipos de columna
spring.jpa.hibernate.ddl-auto=none
server.port=${PORT:8086}
spring.jpa.show-sql=true

app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
